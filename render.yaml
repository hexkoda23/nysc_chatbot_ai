services:
  - type: web
    name: nysc-chatbot-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./nysc_chatbot.db
      - key: RAG_DOCS_PATH
        value: ./rag
      - key: LLM_PROVIDER
        value: auto
      - key: TOP_K
        value: "5"
      - key: MIN_RETRIEVAL_SCORE
        value: "0.2"
